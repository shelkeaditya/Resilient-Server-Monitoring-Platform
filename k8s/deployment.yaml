apiVersion: apps/v1
kind: Deployment
metadata:
  name: anomaly-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: anomaly-app
  template:
    metadata:
      labels:
        app: anomaly-app
    spec:
      containers:
      - name: anomaly-app
        image: shelkeaditya/anomaly-app
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
